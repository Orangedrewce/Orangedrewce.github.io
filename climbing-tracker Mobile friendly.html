<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Day Climbing Training Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
                border-radius: 10px;
            }
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                margin-bottom: 15px;
            }
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        @media (max-width: 768px) {
            .nav-tabs {
                margin-bottom: 20px;
                gap: 5px;
            }
        }
        
        .tab-button {
            padding: 12px 24px;
            background: #ecf0f1;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            color: #7f8c8d;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        @media (max-width: 768px) {
            .tab-button {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
        
        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 992px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-bottom: 20px;
            }
        }
        
        .input-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
        }
        
        @media (max-width: 768px) {
            .input-section {
                padding: 15px;
                border-radius: 10px;
            }
        }
        
        .input-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        @media (max-width: 768px) {
            .input-section h3 {
                font-size: 1.1em;
                margin-bottom: 12px;
            }
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .input-group {
                margin-bottom: 12px;
            }
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 500;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            label {
                font-size: 13px;
            }
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: white;
            font-family: inherit;
            -webkit-appearance: none;
        }
        
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        @media (max-width: 768px) {
            input, select, textarea {
                padding: 12px;
                font-size: 16px; /* Prevents zoom on iOS */
            }
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            -webkit-appearance: checkbox; /* Re-enable default checkbox appearance */
        }
        
        .recommendation-panel {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 15px 0;
        }
        
        @media (max-width: 768px) {
            .recommendation-panel {
                padding: 15px;
                border-radius: 10px;
                margin: 10px 0;
            }
        }
        
        .recommendation-panel h2 {
            font-size: 1.6em;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .recommendation-panel h2 {
                font-size: 1.3em;
            }
        }
        
        .recommendation-text {
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .recommendation-text {
                font-size: 1em;
                margin-bottom: 12px;
            }
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                margin: 15px 0;
            }
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .metric-card {
                padding: 12px;
            }
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        @media (max-width: 768px) {
            .metric-value {
                font-size: 1.6em;
            }
        }
        
        .charts-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .charts-section {
                margin-top: 20px;
            }
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        @media (max-width: 768px) {
            .chart-container {
                padding: 15px;
                border-radius: 10px;
            }
        }
        
        .weekly-chart {
            grid-column: 1 / -1;
            height: 400px;
        }
        
        @media (max-width: 768px) {
            .weekly-chart {
                height: 300px;
            }
        }
        
        .no-data-message {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #7f8c8d;
            font-size: 18px;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .no-data-message {
                font-size: 16px;
            }
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .button-group {
                gap: 8px;
                margin-bottom: 15px;
            }
        }
        
        .update-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
            flex: 1;
            min-width: 140px;
            max-width: 200px;
        }
        
        @media (max-width: 768px) {
            .update-btn {
                padding: 12px 20px;
                font-size: 14px;
                min-width: 120px;
                border-radius: 20px;
            }
        }
        
        .update-btn:hover {
            transform: translateY(-2px);
        }
        
        @media (hover: none) {
            .update-btn:hover {
                transform: none;
            }
        }
        
        .log-entry {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
        }
        
        @media (max-width: 768px) {
            .log-entry {
                padding: 12px;
                margin-bottom: 12px;
            }
        }
        
        .log-date {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .log-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .log-metrics {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                font-size: 13px;
            }
        }
        
        .log-metric {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 5px;
        }
        
        @media (max-width: 768px) {
            .log-metric {
                padding: 6px;
                font-size: 12px;
            }
        }
        
        .log-recommendation, .log-notes {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        .log-recommendation {
             background: #e8f4f8;
             font-weight: bold;
        }

        .log-notes {
            background: #fdf8e2;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        @media (max-width: 768px) {
            .log-recommendation, .log-notes {
                padding: 8px;
            }
        }
        
        .date-selector {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .date-selector {
                gap: 10px;
                margin-bottom: 15px;
            }
            
            .date-selector label {
                font-weight: 600;
                color: #2c3e50;
            }
            
            .date-selector button {
                flex: 0 0 auto;
            }
        }
        
        .date-selector input[type="date"] {
            width: auto;
            min-width: 150px;
            flex: 1;
            max-width: 200px;
        }
        
        @media (max-width: 768px) {
            .date-selector input[type="date"] {
                min-width: unset;
                max-width: unset;
            }
        }
        
        .export-section {
            text-align: center;
            margin-top: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ecf0f1;
        }
        
        @media (max-width: 768px) {
            .export-section {
                margin-top: 15px;
                padding-bottom: 15px;
            }
        }
        
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .delete-btn {
                padding: 6px 12px;
                font-size: 11px;
            }
        }
        
        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        
        @media (hover: none) {
            .delete-btn:hover {
                transform: none;
            }
        }
        
        .export-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin: 0 5px;
        }
        
        @media (max-width: 768px) {
            .export-btn {
                padding: 10px 18px;
                font-size: 13px;
                margin: 5px;
            }
        }
        
        /* Custom Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0s 0.3s;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                width: 100%;
                max-width: 350px;
            }
        }
        
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        
        .modal-content h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .modal-content p {
            margin-bottom: 25px;
            color: #34495e;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .modal-content p {
                font-size: 1em;
                margin-bottom: 20px;
            }
        }
        
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        @media (max-width: 768px) {
            .modal-buttons {
                gap: 10px;
                flex-wrap: wrap;
            }
        }
        
        .modal-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            min-width: 100px;
        }
        
        @media (max-width: 768px) {
            .modal-btn {
                padding: 10px 20px;
                font-size: 14px;
                flex: 1;
            }
        }
        
        .modal-btn-confirm {
            background: #e74c3c;
            color: white;
        }
        
        .modal-btn-confirm:hover {
            background: #c0392b;
        }
        
        .modal-btn-cancel {
            background: #ecf0f1;
            color: #7f8c8d;
        }
        
        .modal-btn-cancel:hover {
            background: #bdc3c7;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>🧗 Multi-Day Climbing Training Tracker</h1>
        
        <div class="nav-tabs">
            <button class="tab-button active" onclick="app.switchTab('daily')">Daily Entry</button>
            <button class="tab-button" onclick="app.switchTab('history')">Training History</button>
            <button class="tab-button" onclick="app.switchTab('analytics')">Analytics</button>
        </div>
        
        <div id="daily" class="tab-content active">
            <div class="date-selector">
                <label for="currentDate">Date:</label>
                <input type="date" id="currentDate">
                <button class="update-btn" onclick="app.loadDataForDate()">Load Date</button>
            </div>
            
            <div class="dashboard">
                <div class="input-section">
                    <h3>Recovery Metrics</h3>
                    <div class="input-group">
                        <label for="sleepQuality">Sleep Quality (1-10)</label>
                        <input type="number" id="sleepQuality" min="1" max="10" step="0.5" placeholder="1-10" oninput="validateNumericInput(this, 1, 10)" onkeypress="return isNumberKey(event)">
                    </div>
                    <div class="input-group">
                        <label for="sleepDuration">Sleep Duration (hours)</label>
                        <input type="number" id="sleepDuration" min="3" max="12" step="0.5" placeholder="3-12" oninput="validateNumericInput(this, 3, 12)" onkeypress="return isNumberKey(event)">
                    </div>
                    <div class="input-group">
                        <label for="mood">Mood State</label>
                        <select id="mood">
                            <option value="">Select mood...</option>
                            <option value="1">Psyched</option>
                            <option value="2">Optimistic</option>
                            <option value="3">Focused</option>
                            <option value="4">Ready</option>
                            <option value="5">Composed</option>
                            <option value="6">Neutral</option>
                            <option value="7">Apathetic</option>
                            <option value="8">Frustrated</option>
                            <option value="9">Lethargic</option>
                            <option value="10">Exhausted</option>
                        </select>
                    </div>
                </div>
                
                <div class="input-section">
                    <h3>Physical State</h3>
                    <div class="input-group">
                        <label for="stress">Stress Level (1-10)</label>
                        <input type="number" id="stress" min="1" max="10" step="1" placeholder="1-10" oninput="validateNumericInput(this, 1, 10)" onkeypress="return isNumberKey(event)">
                    </div>
                    <div class="input-group">
                        <label for="doms">Muscle Soreness (DOMS)</label>
                        <select id="doms">
                            <option value="">Select condition...</option>
                            <option value="1">Absent</option>
                            <option value="2">Noticeable</option>
                            <option value="3">Slightly Stiff</option>
                            <option value="4">Mild Ache</option>
                            <option value="5">Noticeable Ache</option>
                            <option value="6">Moderate Discomfort</option>
                            <option value="7">Significant Pain</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="tendons">Tendon Condition</label>
                        <select id="tendons">
                            <option value="">Select condition...</option>
                            <option value="1">Absent</option>
                            <option value="2">Noticeable</option>
                            <option value="3">Highlighted</option>
                            <option value="4">Mild Ache</option>
                            <option value="5">Annoying Ache</option>
                            <option value="6">Moderate Discomfort</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="skin">Skin Condition</label>
                        <select id="skin">
                            <option value="">Select condition...</option>
                            <option value="1">Perfect</option>
                            <option value="1.5">Robust</option>
                            <option value="3">Slightly Worn</option>
                            <option value="4">Tender Spots</option>
                            <option value="5">Sensitive</option>
                            <option value="6">Raw/Burning</option>
                            <option value="7">Edge Tears</option>
                        </select>
                    </div>
                     <div class="input-group">
                        <label for="mealBeforeTraining">Pre-Training Meal</label>
                        <select id="mealBeforeTraining">
                            <option value="">Select...</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                </div>
                
                <div class="input-section">
                    <h3>Training History</h3>
                    <div class="input-group">
                        <label for="daysSince">Days Since Last Session</label>
                        <input type="number" id="daysSince" min="0" max="14" step="1" placeholder="0-14" oninput="validateNumericInput(this, 0, 14)" onkeypress="return isWholeNumberKey(event)">
                    </div>
                    <div class="input-group">
                        <label for="lastRPE">Last Session RPE (1-10)</label>
                        <input type="number" id="lastRPE" min="1" max="10" step="0.5" placeholder="1-10" oninput="validateNumericInput(this, 1, 10)" onkeypress="return isNumberKey(event)">
                    </div>
                    <div class="input-group">
                        <label>Climbing Type (select all that apply)</label>
                        <div class="checkbox-group" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                            <label for="climbingBouldering">
                                <input type="checkbox" id="climbingBouldering" value="Bouldering">
                                Bouldering
                            </label>
                            <label for="climbingTopRope">
                                <input type="checkbox" id="climbingTopRope" value="Top Rope">
                                Top Rope
                            </label>
                            <label for="climbingLead">
                                <input type="checkbox" id="climbingLead" value="Lead">
                                Lead
                            </label>
                            <label for="climbingNone">
                                <input type="checkbox" id="climbingNone" value="No Training">
                                No Training
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="input-section" style="grid-column: 1 / -1;">
                    <h3>Session Notes</h3>
                    <div class="input-group">
                        <label for="sessionNotes">Comments (optional)</label>
                        <textarea id="sessionNotes" rows="3" placeholder=></textarea>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button class="update-btn" onclick="app.calculateRecommendation()">Update Recommendation</button>
                <button class="update-btn" onclick="app.saveEntry()">Save Entry</button>
                <button class="update-btn" onclick="app.clearCurrentEntry()" style="background: #e74c3c;">Clear Data</button>
            </div>
            
            <div class="recommendation-panel" id="recommendationPanel">
                <h2 id="recommendationTitle">Tomorrow's Training Recommendation</h2>
                <div class="recommendation-text" id="recommendationText">Enter your metrics above to get a recommendation</div>
                <div class="metrics-grid" id="metricsGrid"></div>
            </div>
        </div>
        
        <div id="history" class="tab-content">
            <div class="export-section">
                <button class="export-btn" onclick="app.exportToCSV()">Export to CSV</button>
                <button class="export-btn" onclick="app.confirmClearAllData()" style="background: #e74c3c;">Clear All Data</button>
            </div>
            <div id="historyList" style="padding: 20px 0;"></div>
        </div>
        
        <div id="analytics" class="tab-content">
            <div class="charts-section">
                <div class="chart-container weekly-chart">
                    <canvas id="weeklyTrendChart"></canvas>
                    <div id="noDataMessage" class="no-data-message" style="display: none;">
                        Not enough data to display a chart.<br>Please add at least one entry.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle">Confirmation</h3>
            <p id="modalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="modalConfirmBtn" class="modal-btn modal-btn-confirm">Confirm</button>
                <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">Cancel</button>
            </div>
        </div>
    </div>


    <script>
        // --- INPUT VALIDATION HELPERS ---
        function validateNumericInput(input, min, max) {
            let value = parseFloat(input.value);
            if (isNaN(value)) return;
            if (value > max) input.value = max;
            if (value < min) input.value = min;
        }

        function isNumberKey(evt) {
            const charCode = (evt.which) ? evt.which : evt.keyCode;
            if (charCode > 31 && (charCode < 48 || charCode > 57) && charCode !== 46) {
                return false;
            }
            if (charCode === 46 && evt.target.value.indexOf('.') !== -1) {
                return false;
            }
            return true;
        }

        function isWholeNumberKey(evt) {
            const charCode = (evt.which) ? evt.which : evt.keyCode;
            if (charCode > 31 && (charCode < 48 || charCode > 57)) {
                return false;
            }
            return true;
        }

        class MultiDayTracker {
            constructor() {
                this.trainingData = this.loadData();
                this.weeklyChart = null;
                this.modalCallback = null;
                
                this.setInitialDate();
                this.setupEventListeners();
                this.loadDataForDate();
            }
            
            setInitialDate() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                this.currentDate = `${year}-${month}-${day}`;
                document.getElementById('currentDate').value = this.currentDate;
            }

            // --- SCORING ALGORITHMS ---
            recoveryDecay(days, halfLife = 2.5) { return 1 - Math.exp(-days * Math.log(2) / halfLife); }
            stressImpact(stress) { return 10 / (1 + Math.exp(-0.8 * (stress - 5))); }
            cumulativeFatigue(rpe, days) { return Math.log(1 + rpe) * Math.exp(-days / 3); }
            
            calculateAdvancedReadiness(inputs) {
                const {sleepQuality, sleepDuration, mood, stress, doms, tendons, daysSince, lastRPE, skin, mealBeforeTraining} = inputs;
                if ([sleepQuality, sleepDuration, mood, stress, doms, tendons, daysSince, lastRPE, skin].some(val => val === '' || isNaN(val)) || !mealBeforeTraining) {
                    return null;
                }
                const sleepOptimal = sleepDuration >= 7 && sleepDuration <= 9 ? 1 : Math.exp(-Math.pow((sleepDuration - 8) / 2, 2));
                const sleepScore = (sleepQuality / 10) * sleepOptimal;
                const recoveryScore = this.recoveryDecay(daysSince);
                const stressScore = 1 - (this.stressImpact(stress) / 10);
                const physicalScore = Math.exp(-((doms - 1) + (tendons - 1)) / 5);
                const fatigueScore = 1 - this.cumulativeFatigue(lastRPE, daysSince);
                const moodScore = Math.pow((11 - mood) / 10, 1.5);
                const skinScore = skin <= 3 ? 1 : skin <= 5 ? 0.7 : skin <= 7 ? 0.4 : 0.1;
                
                const mealFactor = mealBeforeTraining === 'yes' ? 1.05 : 0.95;
                
                const baseReadiness = (
                    sleepScore * 0.25 + recoveryScore * 0.20 + stressScore * 0.15 + 
                    physicalScore * 0.20 + fatigueScore * 0.10 + moodScore * 0.10
                ) * skinScore * mealFactor;
                
                const interactionMultiplier = this.calculateInteractions(inputs);
                return Math.max(0, Math.min(10, baseReadiness * 10 * interactionMultiplier));
            }
            
            calculateInteractions(inputs) {
                const {sleepQuality, stress, doms, tendons, daysSince} = inputs;
                const sleepStressBonus = sleepQuality > 7 && stress < 4 ? 1.15 : 1.0;
                const recoveryPainPenalty = (doms > 4 || tendons > 4) && daysSince < 2 ? 0.8 : 1.0;
                const compoundStress = stress > 6 && (doms > 5 || tendons > 5) ? 0.7 : 1.0;
                return sleepStressBonus * recoveryPainPenalty * compoundStress;
            }
            
            // --- RECOMMENDATIONS ---
            generateRecommendation(readinessScore, inputs) {
                const riskFactors = this.assessRiskFactors(inputs);
                const trainingVolume = this.calculateOptimalVolume(readinessScore, riskFactors);
                
                if (readinessScore >= 8.5) return { type: "HIGH INTENSITY", description: "Perfect conditions for limit bouldering or project attempts.", volume: trainingVolume.high, risk: "Low", color: "#27ae60" };
                if (readinessScore >= 7) return { type: "MODERATE INTENSITY", description: "Good for technical climbing and strength training.", volume: trainingVolume.moderate, risk: "Low-Moderate", color: "#f39c12" };
                if (readinessScore >= 5) return { type: "LIGHT TRAINING", description: "Focus on technique, mobility, or easy volume.", volume: trainingVolume.light, risk: "Moderate", color: "#e67e22" };
                if (readinessScore >= 3) return { type: "RECOVERY FOCUS", description: "Active recovery, stretching, or very light movement.", volume: trainingVolume.recovery, risk: "Moderate-High", color: "#e74c3c" };
                return { type: "REST DAY", description: "Complete rest recommended - address limiting factors.", volume: "0 hours", risk: "High", color: "#c0392b" };
            }
            
            assessRiskFactors(inputs) {
                const risks = [];
                if (inputs.tendons > 4) risks.push("Tendon strain risk");
                if (inputs.doms > 5) risks.push("Muscle overload risk");
                if (inputs.stress > 7) risks.push("Psychological stress");
                if (inputs.sleepQuality < 6) risks.push("Insufficient recovery");
                if (inputs.skin > 5) risks.push("Skin injury risk");
                if (inputs.daysSince === 0) risks.push("Insufficient rest");
                return risks;
            }
            
            calculateOptimalVolume(readiness, risks) {
                const baseVolumes = { high: "2-3 hours", moderate: "1.5-2 hours", light: "1-1.5 hours", recovery: "30-60 minutes" };
                if (risks.length > 2) return { high: "1.5-2 hours", moderate: "1-1.5 hours", light: "45-90 minutes", recovery: "20-45 minutes" };
                return baseVolumes;
            }

            // --- DATA & UI ---
            setupEventListeners() {
                document.getElementById('modalConfirmBtn').addEventListener('click', () => this.confirmModal());
                document.getElementById('modalCancelBtn').addEventListener('click', () => this.hideModal());

                const climbingCheckboxes = ['climbingBouldering', 'climbingTopRope', 'climbingLead'];
                const noneCheckbox = document.getElementById('climbingNone');

                climbingCheckboxes.forEach(id => {
                    document.getElementById(id).addEventListener('change', (e) => {
                        if (e.target.checked) {
                            noneCheckbox.checked = false;
                        }
                    });
                });

                noneCheckbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        climbingCheckboxes.forEach(id => {
                            document.getElementById(id).checked = false;
                        });
                    }
                });
            }

            getInputs() {
                const ids = ['sleepQuality', 'sleepDuration', 'mood', 'stress', 'doms', 'tendons', 'skin', 'daysSince', 'lastRPE', 'mealBeforeTraining', 'sessionNotes'];
                const inputs = {};
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    inputs[id] = el.type === 'number' ? parseFloat(el.value) : el.value;
                });

                const climbingTypes = [];
                const climbingCheckboxes = ['climbingBouldering', 'climbingTopRope', 'climbingLead', 'climbingNone'];
                climbingCheckboxes.forEach(id => {
                    const checkbox = document.getElementById(id);
                    if (checkbox.checked) {
                        climbingTypes.push(checkbox.value);
                    }
                });
                inputs.climbingType = climbingTypes.join(', ');

                return inputs;
            }

            calculateRecommendation() {
                const inputs = this.getInputs();
                const readinessScore = this.calculateAdvancedReadiness(inputs);
                const panel = document.getElementById('recommendationPanel');
                const titleEl = document.getElementById('recommendationTitle');
                const textEl = document.getElementById('recommendationText');
                const metricsGrid = document.getElementById('metricsGrid');

                if (readinessScore === null) {
                    titleEl.innerText = "Incomplete Data";
                    textEl.innerText = "Please fill in all metric fields to generate a recommendation.";
                    metricsGrid.innerHTML = '';
                    panel.style.background = `linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%)`;
                    return;
                }

                const recommendation = this.generateRecommendation(readinessScore, inputs);
                panel.style.background = recommendation.color;
                titleEl.innerText = `Recommendation: ${recommendation.type}`;
                textEl.innerText = recommendation.description;
                metricsGrid.innerHTML = `
                    <div class="metric-card">
                        <div class="metric-value">${readinessScore.toFixed(1)}</div>
                        <div>Readiness Score</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${recommendation.volume}</div>
                        <div>Optimal Volume</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${recommendation.risk}</div>
                        <div>Injury Risk</div>
                    </div>
                `;
            }

            saveData() { localStorage.setItem('climbingTrackerData', JSON.stringify(this.trainingData)); }
            loadData() { return JSON.parse(localStorage.getItem('climbingTrackerData') || '{}'); }
            
            saveEntry() {
                const date = document.getElementById('currentDate').value;
                if (!date) {
                    alert('Please select a date.');
                    return;
                }
                const inputs = this.getInputs();
                const readinessScore = this.calculateAdvancedReadiness(inputs);

                if (readinessScore === null) {
                    alert('Please fill all required fields before saving.');
                    return;
                }
                 if (!inputs.climbingType) {
                    alert('Please select at least one Climbing Type.');
                    return;
                }

                const recommendation = this.generateRecommendation(readinessScore, inputs);
                this.trainingData[date] = { inputs, readinessScore, recommendation };
                this.saveData();
                alert(`Entry for ${date} saved successfully!`);
                this.updateHistory();
                this.updateAnalytics();
            }

            loadDataForDate() {
                this.currentDate = document.getElementById('currentDate').value;
                const data = this.trainingData[this.currentDate];
                if (data) {
                    Object.keys(data.inputs).forEach(id => {
                        if (id === 'climbingType') return;
                        const el = document.getElementById(id);
                        if(el) el.value = data.inputs[id];
                    });
                    
                    const climbingCheckboxes = ['climbingBouldering', 'climbingTopRope', 'climbingLead', 'climbingNone'];
                    climbingCheckboxes.forEach(id => document.getElementById(id).checked = false);

                    if(data.inputs.climbingType){
                        const savedTypes = data.inputs.climbingType.split(', ');
                        savedTypes.forEach(type => {
                           const checkbox = document.querySelector(`input[value="${type}"]`);
                           if(checkbox) checkbox.checked = true;
                        });
                    }

                } else {
                    this.clearCurrentEntry(false);
                }
                this.calculateRecommendation();
            }

            clearCurrentEntry(clearDate = true) {
                const ids = ['sleepQuality', 'sleepDuration', 'mood', 'stress', 'doms', 'tendons', 'skin', 'daysSince', 'lastRPE', 'mealBeforeTraining', 'sessionNotes'];
                ids.forEach(id => { document.getElementById(id).value = ''; });
                
                const climbingCheckboxes = ['climbingBouldering', 'climbingTopRope', 'climbingLead', 'climbingNone'];
                climbingCheckboxes.forEach(id => document.getElementById(id).checked = false);

                if (clearDate) {
                    this.setInitialDate();
                }
                this.calculateRecommendation();
            }

            switchTab(tabName) {
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.getElementById(tabName).classList.add('active');
                document.querySelector(`.tab-button[onclick="app.switchTab('${tabName}')"]`).classList.add('active');
                if (tabName === 'history') this.updateHistory();
                if (tabName === 'analytics') this.updateAnalytics();
            }

            updateHistory() {
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = '';
                const sortedDates = Object.keys(this.trainingData).sort((a,b) => new Date(b) - new Date(a));
                if (sortedDates.length === 0) {
                    historyList.innerHTML = '<p style="text-align:center; color:#7f8c8d;">No training history found.</p>';
                    return;
                }
                sortedDates.forEach(date => {
                    const entry = this.trainingData[date];
                    const notesHTML = entry.inputs.sessionNotes ? `<div class="log-notes"><strong>Notes:</strong> ${entry.inputs.sessionNotes}</div>` : '';
                    const logHTML = `
                        <div class="log-entry" style="border-left-color: ${entry.recommendation.color};">
                            <div class="log-date">
                                <span>${new Date(date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                <button class="delete-btn" onclick="app.deleteEntry('${date}')">Delete</button>
                            </div>
                            <div class="log-metrics">
                                <div class="log-metric"><strong>Readiness:</strong> ${entry.readinessScore.toFixed(1)}</div>
                                <div class="log-metric"><strong>Sleep:</strong> ${entry.inputs.sleepQuality}/10</div>
                                <div class="log-metric"><strong>Stress:</strong> ${entry.inputs.stress}/10</div>
                                <div class="log-metric"><strong>DOMS:</strong> ${entry.inputs.doms}/7</div>
                                <div class="log-metric"><strong>Tendons:</strong> ${entry.inputs.tendons}/6</div>
                                <div class="log-metric"><strong>Climbing:</strong> ${entry.inputs.climbingType || 'N/A'}</div>
                            </div>
                            <div class="log-recommendation" style="color: ${entry.recommendation.color};">
                                <strong>Recommendation:</strong> ${entry.recommendation.type} - ${entry.recommendation.description}
                            </div>
                            ${notesHTML}
                        </div>
                    `;
                    historyList.innerHTML += logHTML;
                });
            }

            updateAnalytics() {
                const sortedData = Object.entries(this.trainingData).sort(([dateA], [dateB]) => new Date(dateA) - new Date(dateB));
                const noDataMsg = document.getElementById('noDataMessage');
                const chartCanvas = document.getElementById('weeklyTrendChart');

                if (sortedData.length < 1) {
                    noDataMsg.style.display = 'flex';
                    chartCanvas.style.display = 'none';
                    return;
                }
                
                noDataMsg.style.display = 'none';
                chartCanvas.style.display = 'block';

                const labels = sortedData.map(([date]) => new Date(date + 'T00:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'}));
                const readinessScores = sortedData.map(([, data]) => data.readinessScore);
                const sleepScores = sortedData.map(([, data]) => data.inputs.sleepQuality);
                const stressScores = sortedData.map(([, data]) => data.inputs.stress);

                if (this.weeklyChart) {
                    this.weeklyChart.destroy();
                }

                const ctx = chartCanvas.getContext('2d');
                this.weeklyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Readiness Score', data: readinessScores, borderColor: '#764ba2', tension: 0.1, yAxisID: 'y', borderWidth: 2, pointBackgroundColor: '#764ba2' },
                            { label: 'Sleep Quality', data: sleepScores, borderColor: '#3498db', tension: 0.1, yAxisID: 'y', hidden: true },
                            { label: 'Stress Level', data: stressScores, borderColor: '#e74c3c', tension: 0.1, yAxisID: 'y', hidden: true }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true, max: 10 } },
                        plugins: { title: { display: true, text: 'Training Readiness Trends', font: { size: 16 } } }
                    }
                });
            }

            deleteEntry(date) {
                this.showModal(`Are you sure you want to delete the entry for ${date}?`, () => {
                    delete this.trainingData[date];
                    this.saveData();
                    this.updateHistory();
                    this.updateAnalytics();
                    this.hideModal();
                });
            }

            confirmClearAllData() {
                this.showModal('This will permanently delete all data. Are you sure?', () => {
                    this.trainingData = {};
                    this.saveData();
                    this.updateHistory();
                    this.updateAnalytics();
                    this.hideModal();
                });
            }

            exportToCSV() {
                const data = this.trainingData;
                if (Object.keys(data).length === 0) {
                    alert("No data to export.");
                    return;
                }
                const headers = ['Date', 'ReadinessScore', 'SleepQuality', 'SleepDuration', 'Mood', 'Stress', 'DOMS', 'Tendons', 'Skin', 'DaysSinceLast', 'LastRPE', 'MealBefore', 'ClimbingType', 'SessionNotes', 'RecType', 'RecDesc'];
                let csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n";
                const sortedDates = Object.keys(data).sort((a,b) => new Date(a) - new Date(b));
                
                sortedDates.forEach(date => {
                    const entry = data[date];
                    const notes = entry.inputs.sessionNotes ? `"${entry.inputs.sessionNotes.replace(/"/g, '""')}"` : '';
                    const row = [
                        date,
                        entry.readinessScore.toFixed(2),
                        entry.inputs.sleepQuality, entry.inputs.sleepDuration, entry.inputs.mood, entry.inputs.stress,
                        entry.inputs.doms, entry.inputs.tendons, entry.inputs.skin, entry.inputs.daysSince, entry.inputs.lastRPE,
                        entry.inputs.mealBeforeTraining, `"${entry.inputs.climbingType}"`, notes,
                        entry.recommendation.type, `"${entry.recommendation.description}"`
                    ].join(",");
                    csvContent += row + "\n";
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "climbing_training_log.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // --- MODAL ---
            showModal(message, callback) {
                document.getElementById('modalMessage').innerText = message;
                this.modalCallback = callback;
                document.getElementById('customModal').classList.add('active');
            }

            hideModal() {
                document.getElementById('customModal').classList.remove('active');
                this.modalCallback = null;
            }

            confirmModal() {
                if (this.modalCallback) {
                    this.modalCallback();
                }
            }
        }

        // --- INITIALIZE APP ---
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new MultiDayTracker(); 
        });
    </script>
</body>
